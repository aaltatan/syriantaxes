[project]
name = "syriantaxes"
version = "0.2.0"
description = "A Python package for calculating taxes and compensations for Syrian salaries based on Syrian tax laws."
readme = "README.md"
authors = [{ name = "Abdullah Altatan", email = "a.altatan@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.scripts]
syriantaxes = "syriantaxes:main"

[project.urls]
"Homepage" = "https://github.com/aaltatan/syriantaxes"
"Issues" = "https://github.com/aaltatan/syriantaxes/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
    "ruff>=0.17.1",
    "syriantaxes",
]

[tool.uv.sources]
syriantaxes = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY",    # no copyright headers
    "D100",   # docstrings are optional for modules, classes and functions
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "INP001",  # tests are not a package
    "PLR0913", # pytest fixtures arrive as arguments
    "PLR0917",
    "PLR2004", # literal expected values are the point of a test
    "PT",      # keep the existing pytest style
    "S101",    # assert is how pytest works
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
